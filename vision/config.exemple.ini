# Copiez ce fichier en config.ini (config.ini n'est jamais envoyé sur GitHub).

[maison]
# Identique à MAISON_ID dans firmware/maison_intelligente/config.h
id = maison-ia-elnovic

[mqtt]
hote = broker.hivemq.com
port = 1883

[camera]
# auto      = première webcam trouvée (python lister_cameras.py pour choisir)
# 0, 1, 2   = numéro de webcam (0 = souvent la caméra intégrée du portable)
# ESP32-CAM : http://192.168.1.50:81/stream   (adresse affichée par l'ESP32-CAM)
# Téléphone Android (appli « IP Webcam ») : http://192.168.1.20:8080/video
source = auto
largeur = 640
hauteur = 480
# Si l'image est à l'envers ou de côté : 0, 90, 180 ou 270
rotation = 0
# yes pour un effet miroir (plus naturel pour se placer face à la caméra)
miroir = no

[reconnaissance]
# Similarité minimale pour reconnaître un résident (0.363 conseillé par OpenCV)
seuil = 0.363
# Nombre d'images consécutives nécessaires avant de conclure (évite les erreurs)
images_confirmation = 6
# Délai avant de renvoyer le même résultat (secondes)
delai_rearmement = 20

[telegram]
# 1. Sur Telegram, parlez à @BotFather → /newbot → copiez le token ici
# 2. Envoyez un message à votre bot puis lancez : python telegram_bot.py
#    pour connaître votre chat_id
token =
chat_id =
